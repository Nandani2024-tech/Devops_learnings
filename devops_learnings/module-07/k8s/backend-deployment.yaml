apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-manager-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: task-manager-backend

  template:
    metadata: 
      labels: 
        app: task-manager-backend
      
    spec: 
      containers:
        - name: backend
          image: task-manager-backend:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

